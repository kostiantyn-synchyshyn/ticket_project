<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project - TicketProject</title>

    <link rel="stylesheet" href="/Css/Site.css">

    <style>
        .project-ticket-box {
            margin-top: 24px;
            padding: 24px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            background: #fff;
            color: #111827;
        }

        .project-ticket-list {
            display: grid;
            gap: 12px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .project-ticket-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .project-ticket-information {
            min-width: 0;
        }

        .project-ticket-row a {
            color: #1d4ed8;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .project-ticket-row p {
            margin: 8px 0 0;
            color: #4b5563;
            overflow-wrap: anywhere;
        }

        .project-ticket-status {
            flex-shrink: 0;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            background: #e5e7eb;
            color: #374151;
        }

        .project-ticket-status.in-progress {
            background: #dbeafe;
            color: #1e40af;
        }

        .project-ticket-status.done {
            background: #dcfce7;
            color: #166534;
        }

        #project-content[hidden] {
            display: none;
        }

        @media (max-width: 600px) {
            .project-ticket-row {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
<header class="topbar">
    <div class="logo">TicketProject</div>

    <nav>
        <a href="/Index.html">Projects</a>
        <a href="/CreateProject.html">Create Project</a>
        <a href="/CreateTicket.html">Create Ticket</a>
    </nav>

    <button type="button" class="logout-button" onclick="logout()">
        Logout
    </button>
</header>

<main class="page-container" id="project-page">
    <a href="/Index.html">← Back to projects</a>

    <p id="project-load-message" role="status">
        Loading project…
    </p>

    <div id="project-content" hidden>
        <div class="page-header">
            <div>
                <h1 id="project-heading"></h1>

                <p>
                    <strong>Project key:</strong>
                    <span id="project-key"></span>
                </p>

                <p>
                    <strong>Administrator:</strong>
                    <span id="project-admin"></span>
                </p>
            </div>
        </div>

        <section class="project-ticket-box"
                 aria-labelledby="project-tickets-heading">
            <h2 id="project-tickets-heading">Tickets</h2>

            <p id="project-ticket-count"></p>

            <ul id="project-ticket-list"
                class="project-ticket-list"></ul>
        </section>
    </div>
</main>

<script src="/Js/App.js"></script>
</body>
</html>
